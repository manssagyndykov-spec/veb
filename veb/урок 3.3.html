<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Блочные и линейные элементы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>1. Заголовок h1</h1>
<p>1. Абзац p</p>
<div>1. Контейнер div</div>
<img src="https://via.placeholder.com/100" alt="Картинка">

<hr>

<h1>2. Преобразование элементов</h1>
<p class="inline">2. Абзац, преобразованный в inline</p>
<img class="block" src="https://via.placeholder.com/100" alt="Картинка, преобразованная в block">

<hr>

<h1>3. Вложенные элементы</h1>
<div class="container">
    <p class="child">3. Абзац внутри контейнера</p>
    <img class="child" src="https://via.placeholder.com/80" alt="Картинка внутри контейнера">
    <a class="child" href="#">Ссылка внутри контейнера</a>
</div>

</body>
</html>
